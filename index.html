<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jezzamine Callupe | Ingeniería Informática, Tech4Good</title>
<meta name="description" content="Portafolio de Jezzamine Valeria Callupe Osorio, estudiante de Ingeniería Informática en la UPCH.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:wght@500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F4B;--sky:#BDD4F1;--mist:#DCE9F8;--line:#93B5E2;--btn:#B3CCEE;--paper:#fff;
--head:"Archivo","Segoe UI",sans-serif;--logo:"Fraunces",Georgia,serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--head);color:var(--navy);background:var(--mist);line-height:1.55}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,#A5C4EB,#C6DBF4);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:28px 16px;display:flex;flex-direction:column;gap:24px}
.name{font-family:var(--logo);font-size:1.5rem;line-height:1.2;padding:0 10px}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button{font:500 1.02rem var(--head);color:var(--navy);display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;cursor:pointer}
.menu .ic{width:32px;height:32px;border-radius:8px;background:#ffffffb3;display:grid;place-items:center;font-size:1rem;flex:none}
.menu button:hover{background:#ffffff80}
.menu button[aria-current="page"]{background:#fff;font-weight:700;box-shadow:inset 4px 0 0 var(--navy)}
.stage{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:5;padding:16px clamp(20px,4vw,52px);background:var(--sky);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px}
.top input{flex:1;min-width:0;font:400 1rem var(--head);color:var(--navy);padding:13px 20px;border:2px solid var(--line);border-radius:999px;background:#fff}
.lang{display:flex;align-items:stretch;background:var(--btn);flex:none;border:2px solid var(--navy);border-radius:999px;overflow:hidden}
.lang button{font:600 .95rem var(--head);color:var(--navy);background:var(--btn);border:0;padding:11px 16px;cursor:pointer}
.lang .sep{align-self:center;font-weight:600}
.lang button[aria-pressed="true"]{background:#fff;font-weight:700;box-shadow:inset 0 -4px 0 var(--navy)}
.top input::placeholder{color:var(--navy);opacity:.6}
.top input:focus{border-color:var(--navy);outline:0}
.top input:disabled{background:#D0E0F5}
main{padding:32px clamp(20px,4vw,52px) 64px;width:100%}
h2{font-size:clamp(1.6rem,2.6vw,2.1rem);line-height:1.15;margin-bottom:24px;padding-bottom:10px;border-bottom:3px solid var(--navy);display:inline-block}
h3{line-height:1.2}
.view{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{display:grid;grid-template-columns:260px 1fr;gap:32px;align-items:start}
.photo{width:260px;height:260px;border-radius:12px;border:4px solid var(--navy);background:linear-gradient(160deg,#D2E2F6,#9DBDEB);display:grid;place-items:center;text-align:center;font-weight:600;padding:20px}
.photo img{width:66%;height:auto;max-height:100%;object-fit:cover;border-radius:6px;border:2px solid var(--navy)}
.msg p{margin-bottom:13px;max-width:64ch}
.msg p:first-child{font-size:1.12rem;font-weight:700}
.block{margin-top:34px}
.block h3{font-size:1.2rem;margin-bottom:14px}
.links{display:flex;flex-wrap:wrap;gap:12px;list-style:none;padding:0}
.links a,.btn{display:inline-block;text-decoration:none;font-weight:600;background:var(--btn);color:var(--navy);border:2px solid var(--navy);padding:10px 20px;border-radius:10px}
.links a:hover,.btn:hover{background:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.card{background:var(--paper);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.pic,.tpic,.dpic{background:linear-gradient(135deg,#D2E2F6,#86ABDF);position:relative;display:grid;place-items:center;font-size:.82rem;padding:12px;text-align:center}
.pic{height:160px}
.pic img,.tpic img,.dpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.zoomable{cursor:zoom-in}
.fit img{object-fit:contain}
.card .body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.15rem}
.meta{font-size:.9rem}
.badge{align-self:flex-start;background:var(--btn);border:1px solid var(--navy);font-weight:600;font-size:.82rem;padding:3px 10px;border-radius:6px}
ul.d{padding-left:18px;font-size:.95rem}
ul.d li{margin-bottom:5px}
.card .go{margin-top:auto;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.tile{font:inherit;color:var(--navy);text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;padding:0;transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--navy);transform:translateY(-3px)}
.tpic{height:220px}
.tname{padding:16px 18px;font-weight:700;font-size:1.12rem;line-height:1.25}
.back{font:600 1rem var(--head);color:var(--navy);background:var(--btn);border:2px solid var(--navy);border-radius:10px;padding:8px 16px;cursor:pointer;margin-bottom:24px}
.back:hover{background:#fff}
.dgrid{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:32px;align-items:start}
.dpic{aspect-ratio:4/3;border-radius:16px;border:2px solid var(--navy);overflow:hidden}
.dtext h2{margin-bottom:14px}
.dtext .meta{margin-bottom:12px;font-size:1rem}
.dtext .badge{margin-bottom:14px;display:inline-block}
.dtext ul.d{font-size:1.02rem;margin-bottom:20px}
.empty{font-size:1.05rem}
dialog{border:0;border-radius:14px;padding:0;max-width:min(92vw,900px);background:transparent}
dialog::backdrop{background:#081433cc}
dialog img{width:100%;display:block;border-radius:14px}
@media (max-width:980px){
  .app{grid-template-columns:210px 1fr}
  .hero,.dgrid{grid-template-columns:1fr}
  .photo{margin:0 auto}
}
@media (max-width:640px){
  .top{flex-wrap:wrap}
  .lang button{padding:9px 12px}
  .app{grid-template-columns:64px 1fr}
  aside{padding:14px 8px}
  .name,.menu .lb{display:none}
  .menu button{justify-content:center;padding:8px 0}
}
@media (prefers-reduced-motion:reduce){.view,.tile{animation:none;transition:none}html{scroll-behavior:auto}}
</style>
</head>

const MSG={es:`<div class="msg" id="resumen">
        <p>¡Hola, Builders! 👋 Soy Jezzamine Valeria Callupe Osorio. Estudiante de Ingeniería Informática en la Universidad Peruana Cayetano Heredia (UPCH) | Lima, Perú.</p>
        <p>No solo escribo código; construyo soluciones con propósito. Mi pasión reside en la intersección del desarrollo de software, la Inteligencia Artificial, la ciberseguridad, la gestión y la tecnología blockchain. Me especializo en traducir problemas complejos en productos digitales escalables. Mi enfoque es estratégico y de impacto social: busco que la tecnología resuelva brechas tangibles, priorizando la inclusión financiera y el Tech4Good (tecnología aplicada al bien social).</p>
        <p>En entornos colaborativos aporto una visión analítica, creatividad y una ejecución ágil. Considero firmemente que la tecnología más poderosa es aquella que empodera a las personas y opera bajo principios de sostenibilidad, optimizando recursos y generando un impacto positivo y medible en nuestro entorno.</p>
        <p>¿Tienes un reto o una idea para resolver una problemática crítica? Conectemos y construyamos soluciones que generen valor real.</p>
      </div>`,en:`<div class="msg" id="resumen">
      <p>Hello, Builders! 👋 I'm Jezzamine Valeria Callupe Osorio. Computer Engineering student at Universidad Peruana Cayetano Heredia (UPCH) | Lima, Peru.</p>
      <p>I don't just write code; I build solutions with purpose. My passion lies at the intersection of software development, Artificial Intelligence, cybersecurity, management, and blockchain technology. I specialize in turning complex problems into scalable digital products. My approach is strategic and socially driven: I want technology to close tangible gaps, prioritizing financial inclusion and Tech4Good (technology applied to the social good).</p>
      <p>In collaborative environments I bring an analytical vision, creativity, and agile execution. I firmly believe that the most powerful technology is the kind that empowers people and operates under principles of sustainability, optimizing resources and generating a positive, measurable impact on our environment.</p>
      <p>Do you have a challenge or an idea to solve a critical problem? Let's connect and build solutions that create real value.</p>
    </div>`};
const I18N={
 es:{perfil:"Perfil",estudios:"Estudios",proyectos:"Proyectos",eventos:"Participaciones",voluntariado:"Voluntariado",
  t_estudios:"Estudios",t_proyectos:"Proyectos de innovación y tecnología",t_eventos:"Participaciones destacadas y conferencias",t_voluntariado:"Voluntariado y liderazgo comunitario",
  connect:"Conecta conmigo",cv:"Descargar CV",view:"Ver proyecto",back:"Volver a",search:"Buscar en",phProfile:"El buscador funciona en Estudios, Proyectos, Participaciones y Voluntariado",none:"No hay resultados en",photo:"Tu foto aquí",title:"Jezzamine Callupe | Ingeniería Informática, Tech4Good"},
 en:{perfil:"Profile",estudios:"Education",proyectos:"Projects",eventos:"Events",voluntariado:"Volunteering",
  t_estudios:"Education",t_proyectos:"Innovation and technology projects",t_eventos:"Featured events and conferences",t_voluntariado:"Volunteering and community leadership",
  connect:"Connect with me",cv:"Download CV",view:"View project",back:"Back to",search:"Search in",phProfile:"Search works in Education, Projects, Events and Volunteering",none:"No results in",photo:"Your photo here",title:"Jezzamine Callupe | Computer Engineering, Tech4Good"}
};
let lang="es"; try{ lang=localStorage.getItem("lang")==="en"?"en":"es"; }catch(e){}
const T=k=>I18N[lang][k];
const SECTIONS=[
  {id:"perfil",icon:"👤",list:[]},
  {id:"estudios",icon:"🎓",list:ESTUDIOS,tiles:false},
  {id:"proyectos",icon:"🚀",list:PROYECTOS,tiles:true},
  {id:"eventos",icon:"🎤",list:EVENTOS,tiles:true},
  {id:"voluntariado",icon:"🤝",list:VOLUNTARIADO,tiles:true}
];
const loc=(id,i)=>{ const c=SECTIONS.find(x=>x.id===id).list[i]; return lang==="en"?{...c,...EN[id][i]}:c; };
const menu=document.getElementById("menu"), content=document.getElementById("content"), q=document.getElementById("q"), zoom=document.getElementById("zoom"), langBox=document.getElementById("lang");
const buildMenu=()=>{ menu.innerHTML=SECTIONS.map(s=>`<button data-id="${s.id}" title="${T(s.id)}"><span class="ic">${s.icon}</span><span class="lb">${T(s.id)}</span></button>`).join(""); };

let sec="perfil", openIdx=null;
const txt=c=>(c.t+" "+c.m+" "+c.d.join(" ")+" "+(c.badge||"")).toLowerCase();
const fc=(base,c)=>`class="${base}${c.fit?" fit":""}"${c.fit?` style="background:${c.fit}"`:""}`;
const ph=c=>c.foto.startsWith("data:")?"":"Foto: "+c.foto;
const img=(c,cls="")=>`<img class="${cls}" src="${c.foto}" alt="${c.t}" loading="lazy" onerror="this.remove()">`;
const bullets=c=>`<ul class="d">${c.d.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const link=(c,cls)=>c.link?`<a class="${cls}" href="${c.link}" target="_blank" rel="noopener">${T("view")}</a>`:"";

const perfil=()=>`
  <div class="hero">
    <div class="photo"><img src="${FOTO_PERFIL}" alt="Jezzamine Callupe" onerror="this.parentNode.textContent='${T("photo")}'"></div>
    ${MSG[lang]}
  </div>
  <div class="block"><h3>${T("connect")}</h3>
    <ul class="links">
      <li><a href="${LINKS.linkedin}" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="${LINKS.email}">Gmail</a></li>
      <li><a href="${LINKS.github}" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="${lang==="en"?LINKS.cvEn:LINKS.cvEs}" download="${lang==="en"?"CV_Jezzamine_Callupe_EN.pdf":"CV_Jezzamine_Callupe_ES.pdf"}">${T("cv")}</a></li>
    </ul>
  </div>`;

const cards=l=>`<div class="grid">${l.map(({c})=>`
  <article class="card"><div ${fc("pic",c)}>${ph(c)}${img(c,"zoomable")}</div>
  <div class="body"><h3>${c.t}</h3><p class="meta">${c.m}</p>${c.badge?`<span class="badge">${c.badge}</span>`:""}${bullets(c)}${link(c,"go")}</div></article>`).join("")}</div>`;

const tiles=l=>`<div class="tiles">${l.map(({c,i})=>`
  <button class="tile" data-i="${i}"><span ${fc("tpic",c)}>${ph(c)}${img(c)}</span><span class="tname">${c.t}</span></button>`).join("")}</div>`;

const detail=(c,label)=>`
  <button class="back" data-back>${T("back")} ${label}</button>
  <div class="dgrid"><div ${fc("dpic",c)}>${ph(c)}${img(c,"zoomable")}</div>
  <div class="dtext"><h2>${c.t}</h2><p class="meta">${c.m}</p>${c.badge?`<span class="badge">${c.badge}</span>`:""}${bullets(c)}${link(c,"btn")}</div></div>`;

function render(){
  const s=SECTIONS.find(x=>x.id===sec), t=q.value.trim().toLowerCase();
  document.documentElement.lang=lang; document.title=T("title");
  q.disabled=sec==="perfil";
  q.placeholder=sec==="perfil"?T("phProfile"):T("search")+" "+T(sec);
  q.setAttribute("aria-label",q.placeholder);
  langBox.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  menu.querySelectorAll("button").forEach(b=>b.dataset.id===sec?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  let html;
  if(sec==="perfil") html=perfil();
  else if(openIdx!==null) html=detail(loc(sec,openIdx),T(sec));
  else{
    const l=s.list.map((_,i)=>({c:loc(sec,i),i})).filter(({c})=>!t||txt(c).includes(t));
    html=`<h2>${T("t_"+sec)}</h2>`+(l.length?(s.tiles?tiles(l):cards(l)):`<p class="empty">${T("none")} ${T(sec)}.</p>`);
  }
  content.innerHTML=`<section class="view">${html}</section>`;
}
function go(id){ sec=SECTIONS.some(x=>x.id===id)?id:"perfil"; openIdx=null; q.value=""; render(); history.replaceState(null,"","#"+sec); window.scrollTo({top:0}); }
function setLang(l){ lang=l; try{localStorage.setItem("lang",l);}catch(e){} buildMenu(); render(); }

menu.addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) go(b.dataset.id); });
langBox.addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setLang(b.dataset.lang); });
q.addEventListener("input",()=>{ openIdx=null; render(); });
content.addEventListener("click",e=>{
  const tile=e.target.closest(".tile"), back=e.target.closest("[data-back]");
  if(tile){ openIdx=+tile.dataset.i; render(); window.scrollTo({top:0}); }
  else if(back){ openIdx=null; render(); window.scrollTo({top:0}); }
  else if(e.target.matches("img.zoomable")){ const z=zoom.querySelector("img"); z.src=e.target.src; z.alt=e.target.alt; zoom.showModal(); }
});
zoom.addEventListener("click",()=>zoom.close());
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
buildMenu();
go(location.hash.slice(1));
</script>
</body>
</html>
